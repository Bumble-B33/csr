plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }

    }

    // Accessories
    /*maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.su5ed.dev/releases' }
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://maven.shedaniel.me/' }*/
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    implementation("maven.modrinth:jade:${jade_fabric_version}")

    implementation("com.terraformersmc:modmenu:${modmenu_fabric_version}")


    //modCompileOnlyApi("io.wispforest:accessories-fabric:${accessories_version}+${minecraft_version}")
    include(api("teamreborn:energy:${fabric_energy_version}"))

    //Todo remove
    runtimeOnly("maven.modrinth:techreborn:6.0.5")
}

loom {
    //def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    //if (aw.exists()) {
    //    accessWidenerPath.set(aw)
    //}
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}